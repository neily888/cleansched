<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CleanFlow - Property Management</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@300;400;500;600;700;800&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Libre Franklin', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #334155 100%);
            min-height: 100vh;
            color: #e2e8f0;
        }
        
        .heading-font {
            font-family: 'Fraunces', serif;
        }
        
        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .glass-strong {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        
        .card-shadow {
            box-shadow: 0 20px 60px -15px rgba(0, 0, 0, 0.5);
        }
        
        .status-pending { background: #fbbf24; color: #78350f; }
        .status-assigned { background: #60a5fa; color: #1e3a8a; }
        .status-in-progress { background: #a78bfa; color: #4c1d95; }
        .status-completed { background: #34d399; color: #064e3b; }
        
        .animate-fade-in {
            animation: fadeIn 0.5s ease-in;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .hover-lift {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        
        .hover-lift:hover {
            transform: translateY(-2px);
            box-shadow: 0 25px 70px -15px rgba(0, 0, 0, 0.6);
        }
        
        .scroll-hidden::-webkit-scrollbar {
            display: none;
        }
        
        .scroll-hidden {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        
        input, select, textarea {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #e2e8f0;
            transition: all 0.2s;
        }
        
        input:focus, select:focus, textarea:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.08);
            border-color: #60a5fa;
        }
        
        button {
            transition: all 0.2s;
        }
        
        button:active {
            transform: scale(0.98);
        }
        
        .tab-active {
            background: rgba(96, 165, 250, 0.2);
            border-bottom: 2px solid #60a5fa;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useEffect } = React;
        
        // Icons as React components
        const Icons = {
            Home: () => (
                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
                </svg>
            ),
            Calendar: () => (
                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                </svg>
            ),
            Tasks: () => (
                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" />
                </svg>
            ),
            Properties: () => (
                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
                </svg>
            ),
            Team: () => (
                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" />
                </svg>
            ),
            Reports: () => (
                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
                </svg>
            ),
            Photos: () => (
                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                </svg>
            ),
            Plus: () => (
                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 4v16m8-8H4" />
                </svg>
            ),
            Check: () => (
                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 13l4 4L19 7" />
                </svg>
            ),
            Clock: () => (
                <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
            ),
            User: () => (
                <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                </svg>
            ),
            Map: () => (
                <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
            ),
        };
        
        // Initial demo data
        const initialData = {
            properties: [
                { id: 1, name: 'Ocean View Suite', address: '123 Beach Rd, Miami', type: 'Apartment', bedrooms: 2, status: 'active' },
                { id: 2, name: 'Downtown Loft', address: '456 Main St, NYC', type: 'Loft', bedrooms: 1, status: 'active' },
                { id: 3, name: 'Garden Villa', address: '789 Park Ave, LA', type: 'House', bedrooms: 3, status: 'active' },
                { id: 4, name: 'City Studio', address: '321 Urban St, Chicago', type: 'Studio', bedrooms: 1, status: 'active' },
            ],
            bookings: [
                { id: 1, propertyId: 1, guestName: 'Sarah Johnson', checkIn: '2026-01-09', checkOut: '2026-01-12', guests: 2, status: 'confirmed' },
                { id: 2, propertyId: 2, guestName: 'Mike Chen', checkIn: '2026-01-10', checkOut: '2026-01-13', guests: 1, status: 'confirmed' },
                { id: 3, propertyId: 1, guestName: 'Emma Wilson', checkIn: '2026-01-13', checkOut: '2026-01-16', guests: 3, status: 'confirmed' },
                { id: 4, propertyId: 3, guestName: 'David Brown', checkIn: '2026-01-11', checkOut: '2026-01-14', guests: 4, status: 'confirmed' },
                { id: 5, propertyId: 4, guestName: 'Lisa Martinez', checkIn: '2026-01-12', checkOut: '2026-01-15', guests: 1, status: 'confirmed' },
            ],
            tasks: [
                { id: 1, propertyId: 1, bookingId: 1, type: 'checkout-cleaning', assignedTo: 'Maria Garcia', status: 'pending', scheduledDate: '2026-01-12', time: '11:00 AM' },
                { id: 2, propertyId: 2, bookingId: 2, type: 'checkout-cleaning', assignedTo: 'John Smith', status: 'assigned', scheduledDate: '2026-01-13', time: '10:00 AM' },
                { id: 3, propertyId: 1, bookingId: 3, type: 'checkout-cleaning', assignedTo: 'Maria Garcia', status: 'pending', scheduledDate: '2026-01-16', time: '11:00 AM' },
                { id: 4, propertyId: 3, bookingId: 4, type: 'inspection', assignedTo: 'Alex Johnson', status: 'in-progress', scheduledDate: '2026-01-09', time: '2:00 PM' },
            ],
            team: [
                { id: 1, name: 'Maria Garcia', role: 'cleaner', phone: '555-0101', email: 'maria@example.com', tasksCompleted: 47 },
                { id: 2, name: 'John Smith', role: 'cleaner', phone: '555-0102', email: 'john@example.com', tasksCompleted: 39 },
                { id: 3, name: 'Alex Johnson', role: 'inspector', phone: '555-0103', email: 'alex@example.com', tasksCompleted: 28 },
                { id: 4, name: 'Sophie Lee', role: 'coordinator', phone: '555-0104', email: 'sophie@example.com', tasksCompleted: 0 },
            ],
            checklists: {
                'checkout-cleaning': [
                    { id: 1, item: 'Change all bed linens', completed: false },
                    { id: 2, item: 'Clean and sanitize bathroom', completed: false },
                    { id: 3, item: 'Vacuum all floors', completed: false },
                    { id: 4, item: 'Clean kitchen and appliances', completed: false },
                    { id: 5, item: 'Empty all trash bins', completed: false },
                    { id: 6, item: 'Check for damages', completed: false },
                    { id: 7, item: 'Restock amenities', completed: false },
                ],
                'inspection': [
                    { id: 1, item: 'Check smoke detectors', completed: false },
                    { id: 2, item: 'Test all appliances', completed: false },
                    { id: 3, item: 'Inspect for maintenance issues', completed: false },
                    { id: 4, item: 'Verify inventory', completed: false },
                ],
            },
            photos: [],
        };
        
        function App() {
            const [activeTab, setActiveTab] = useState('dashboard');
            const [data, setData] = useState(initialData);
            const [showModal, setShowModal] = useState(null);
            const [selectedProperty, setSelectedProperty] = useState(null);
            const [selectedTask, setSelectedTask] = useState(null);
            
            // Load data from storage on mount
            useEffect(() => {
                const loadData = async () => {
                    try {
                        const stored = await window.storage.get('cleanflow-data');
                        if (stored && stored.value) {
                            setData(JSON.parse(stored.value));
                        }
                    } catch (error) {
                        console.log('No stored data, using defaults');
                    }
                };
                loadData();
            }, []);
            
            // Save data to storage whenever it changes
            useEffect(() => {
                const saveData = async () => {
                    try {
                        await window.storage.set('cleanflow-data', JSON.stringify(data));
                    } catch (error) {
                        console.error('Failed to save data:', error);
                    }
                };
                saveData();
            }, [data]);
            
            const addProperty = (property) => {
                const newProperty = {
                    ...property,
                    id: Math.max(0, ...data.properties.map(p => p.id)) + 1,
                    status: 'active'
                };
                setData({ ...data, properties: [...data.properties, newProperty] });
                setShowModal(null);
            };
            
            const addBooking = (booking) => {
                const newBooking = {
                    ...booking,
                    id: Math.max(0, ...data.bookings.map(b => b.id)) + 1,
                    status: 'confirmed'
                };
                setData({ ...data, bookings: [...data.bookings, newBooking] });
                
                // Auto-create cleaning task
                const newTask = {
                    id: Math.max(0, ...data.tasks.map(t => t.id)) + 1,
                    propertyId: booking.propertyId,
                    bookingId: newBooking.id,
                    type: 'checkout-cleaning',
                    assignedTo: null,
                    status: 'pending',
                    scheduledDate: booking.checkOut,
                    time: '11:00 AM'
                };
                setData(prev => ({ ...prev, tasks: [...prev.tasks, newTask] }));
                setShowModal(null);
            };
            
            const addTeamMember = (member) => {
                const newMember = {
                    ...member,
                    id: Math.max(0, ...data.team.map(m => m.id)) + 1,
                    tasksCompleted: 0
                };
                setData({ ...data, team: [...data.team, newMember] });
                setShowModal(null);
            };
            
            const updateTaskStatus = (taskId, newStatus) => {
                const updatedTasks = data.tasks.map(task => 
                    task.id === taskId ? { ...task, status: newStatus } : task
                );
                setData({ ...data, tasks: updatedTasks });
            };
            
            const assignTask = (taskId, teamMemberId) => {
                const teamMember = data.team.find(m => m.id === parseInt(teamMemberId));
                const updatedTasks = data.tasks.map(task => 
                    task.id === taskId ? { ...task, assignedTo: teamMember.name, status: 'assigned' } : task
                );
                setData({ ...data, tasks: updatedTasks });
            };
            
            const addPhoto = (taskId, photoData) => {
                const newPhoto = {
                    id: Math.max(0, ...data.photos.map(p => p.id)) + 1,
                    taskId,
                    url: photoData.url,
                    category: photoData.category,
                    timestamp: new Date().toISOString(),
                    uploadedBy: photoData.uploadedBy
                };
                setData({ ...data, photos: [...data.photos, newPhoto] });
            };
            
            const getPropertyName = (propertyId) => {
                const property = data.properties.find(p => p.id === propertyId);
                return property ? property.name : 'Unknown';
            };
            
            const getBookingInfo = (bookingId) => {
                return data.bookings.find(b => b.id === bookingId);
            };
            
            const getTodaysTasks = () => {
                const today = new Date().toISOString().split('T')[0];
                return data.tasks.filter(task => task.scheduledDate === today);
            };
            
            const getUpcomingCheckouts = () => {
                const today = new Date();
                const threeDaysLater = new Date(today);
                threeDaysLater.setDate(today.getDate() + 3);
                
                return data.bookings.filter(booking => {
                    const checkoutDate = new Date(booking.checkOut);
                    return checkoutDate >= today && checkoutDate <= threeDaysLater;
                });
            };
            
            return (
                <div className="min-h-screen p-4 md:p-8">
                    <div className="max-w-7xl mx-auto">
                        {/* Header */}
                        <div className="mb-8 animate-fade-in">
                            <h1 className="heading-font text-5xl md:text-6xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-blue-300 via-purple-300 to-pink-300 mb-2">
                                CleanFlow
                            </h1>
                            <p className="text-slate-400 text-lg">Property Management & Cleaning Coordination</p>
                        </div>
                        
                        {/* Navigation */}
                        <div className="glass rounded-2xl p-2 mb-6 card-shadow animate-fade-in">
                            <div className="flex overflow-x-auto scroll-hidden gap-2">
                                {[
                                    { id: 'dashboard', label: 'Dashboard', icon: Icons.Home },
                                    { id: 'calendar', label: 'Calendar', icon: Icons.Calendar },
                                    { id: 'tasks', label: 'Tasks', icon: Icons.Tasks },
                                    { id: 'properties', label: 'Properties', icon: Icons.Properties },
                                    { id: 'team', label: 'Team', icon: Icons.Team },
                                    { id: 'photos', label: 'Photos', icon: Icons.Photos },
                                    { id: 'reports', label: 'Reports', icon: Icons.Reports },
                                ].map(tab => (
                                    <button
                                        key={tab.id}
                                        onClick={() => setActiveTab(tab.id)}
                                        className={`flex items-center gap-2 px-4 py-3 rounded-xl transition-all whitespace-nowrap ${
                                            activeTab === tab.id 
                                                ? 'tab-active text-blue-300 font-semibold' 
                                                : 'hover:bg-white/5 text-slate-400'
                                        }`}
                                    >
                                        <tab.icon />
                                        <span className="hidden sm:inline">{tab.label}</span>
                                    </button>
                                ))}
                            </div>
                        </div>
                        
                        {/* Content Area */}
                        <div className="animate-fade-in">
                            {activeTab === 'dashboard' && (
                                <Dashboard 
                                    data={data}
                                    getTodaysTasks={getTodaysTasks}
                                    getUpcomingCheckouts={getUpcomingCheckouts}
                                    getPropertyName={getPropertyName}
                                    updateTaskStatus={updateTaskStatus}
                                    setActiveTab={setActiveTab}
                                />
                            )}
                            
                            {activeTab === 'calendar' && (
                                <Calendar 
                                    bookings={data.bookings}
                                    properties={data.properties}
                                    tasks={data.tasks}
                                    getPropertyName={getPropertyName}
                                />
                            )}
                            
                            {activeTab === 'tasks' && (
                                <Tasks 
                                    tasks={data.tasks}
                                    team={data.team}
                                    properties={data.properties}
                                    bookings={data.bookings}
                                    checklists={data.checklists}
                                    getPropertyName={getPropertyName}
                                    getBookingInfo={getBookingInfo}
                                    updateTaskStatus={updateTaskStatus}
                                    assignTask={assignTask}
                                    setSelectedTask={setSelectedTask}
                                    selectedTask={selectedTask}
                                    addPhoto={addPhoto}
                                />
                            )}
                            
                            {activeTab === 'properties' && (
                                <Properties 
                                    properties={data.properties}
                                    bookings={data.bookings}
                                    setShowModal={setShowModal}
                                    setSelectedProperty={setSelectedProperty}
                                />
                            )}
                            
                            {activeTab === 'team' && (
                                <Team 
                                    team={data.team}
                                    tasks={data.tasks}
                                    setShowModal={setShowModal}
                                />
                            )}
                            
                            {activeTab === 'photos' && (
                                <Photos 
                                    photos={data.photos}
                                    tasks={data.tasks}
                                    properties={data.properties}
                                    getPropertyName={getPropertyName}
                                />
                            )}
                            
                            {activeTab === 'reports' && (
                                <Reports 
                                    data={data}
                                    getPropertyName={getPropertyName}
                                />
                            )}
                        </div>
                    </div>
                    
                    {/* Modals */}
                    {showModal === 'addProperty' && (
                        <Modal onClose={() => setShowModal(null)}>
                            <AddPropertyForm onSubmit={addProperty} />
                        </Modal>
                    )}
                    
                    {showModal === 'addBooking' && (
                        <Modal onClose={() => setShowModal(null)}>
                            <AddBookingForm properties={data.properties} onSubmit={addBooking} />
                        </Modal>
                    )}
                    
                    {showModal === 'addTeamMember' && (
                        <Modal onClose={() => setShowModal(null)}>
                            <AddTeamMemberForm onSubmit={addTeamMember} />
                        </Modal>
                    )}
                </div>
            );
        }
        
        // Dashboard Component
        function Dashboard({ data, getTodaysTasks, getUpcomingCheckouts, getPropertyName, updateTaskStatus, setActiveTab }) {
            const todaysTasks = getTodaysTasks();
            const upcomingCheckouts = getUpcomingCheckouts();
            const pendingTasks = data.tasks.filter(t => t.status === 'pending').length;
            const activeProperties = data.properties.filter(p => p.status === 'active').length;
            
            return (
                <div className="space-y-6">
                    {/* Stats */}
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                        <StatCard 
                            title="Active Properties" 
                            value={activeProperties} 
                            color="blue"
                            onClick={() => setActiveTab('properties')}
                        />
                        <StatCard 
                            title="Today's Tasks" 
                            value={todaysTasks.length} 
                            color="purple"
                            onClick={() => setActiveTab('tasks')}
                        />
                        <StatCard 
                            title="Pending Tasks" 
                            value={pendingTasks} 
                            color="amber"
                            onClick={() => setActiveTab('tasks')}
                        />
                        <StatCard 
                            title="Team Members" 
                            value={data.team.length} 
                            color="emerald"
                            onClick={() => setActiveTab('team')}
                        />
                    </div>
                    
                    {/* Today's Tasks */}
                    <div className="glass-strong rounded-2xl p-6 card-shadow">
                        <h2 className="heading-font text-2xl font-bold mb-4 text-blue-300">Today's Tasks</h2>
                        {todaysTasks.length === 0 ? (
                            <p className="text-slate-400">No tasks scheduled for today</p>
                        ) : (
                            <div className="space-y-3">
                                {todaysTasks.map(task => (
                                    <TaskCard 
                                        key={task.id}
                                        task={task}
                                        propertyName={getPropertyName(task.propertyId)}
                                        updateTaskStatus={updateTaskStatus}
                                    />
                                ))}
                            </div>
                        )}
                    </div>
                    
                    {/* Upcoming Checkouts */}
                    <div className="glass-strong rounded-2xl p-6 card-shadow">
                        <h2 className="heading-font text-2xl font-bold mb-4 text-purple-300">Upcoming Checkouts</h2>
                        {upcomingCheckouts.length === 0 ? (
                            <p className="text-slate-400">No checkouts in the next 3 days</p>
                        ) : (
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                {upcomingCheckouts.map(booking => (
                                    <div key={booking.id} className="glass rounded-xl p-4 hover-lift">
                                        <h3 className="font-semibold text-lg mb-2">{getPropertyName(booking.propertyId)}</h3>
                                        <div className="space-y-1 text-sm text-slate-300">
                                            <p><span className="text-slate-400">Guest:</span> {booking.guestName}</p>
                                            <p><span className="text-slate-400">Checkout:</span> {booking.checkOut}</p>
                                            <p><span className="text-slate-400">Guests:</span> {booking.guests}</p>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>
                </div>
            );
        }
        
        // Calendar Component
        function Calendar({ bookings, properties, tasks, getPropertyName }) {
            const [currentDate, setCurrentDate] = useState(new Date());
            const [view, setView] = useState('week'); // week or month
            
            const getWeekDays = () => {
                const start = new Date(currentDate);
                start.setDate(start.getDate() - start.getDay());
                const days = [];
                for (let i = 0; i < 7; i++) {
                    const day = new Date(start);
                    day.setDate(start.getDate() + i);
                    days.push(day);
                }
                return days;
            };
            
            const getBookingsForDate = (date) => {
                const dateStr = date.toISOString().split('T')[0];
                return bookings.filter(b => {
                    const checkIn = new Date(b.checkIn);
                    const checkOut = new Date(b.checkOut);
                    const current = new Date(dateStr);
                    return current >= checkIn && current <= checkOut;
                });
            };
            
            const getTasksForDate = (date) => {
                const dateStr = date.toISOString().split('T')[0];
                return tasks.filter(t => t.scheduledDate === dateStr);
            };
            
            const weekDays = getWeekDays();
            
            return (
                <div className="glass-strong rounded-2xl p-6 card-shadow">

                                onClick={() => {

                                    newDate.setDate(newDate.getDate() - 7);
                                    setCurrentDate(newDate);
                                }}
                                className="px-4 py-2 glass rounded-lg hover:bg-white/10"
                            >
                                Previous
                            </button>
                            <button 
                                onClick={() => setCurrentDate(new Date())}
                                className="px-4 py-2 glass rounded-lg hover:bg-white/10"
                            >
                                Today
                            </button>
                            <button 
                                onClick={() => {

                                }}

                            >

                            </button>
                        </div>
                    </div>

                        {weekDays.map((day, idx) => {

                            const dayBookings = getBookingsForDate(day);
                            const dayTasks = getTasksForDate(day);
                            
                            return (
                                <div key={idx} className={`glass rounded-xl p-3 min-h-[150px] ${isToday ? 'ring-2 ring-blue-400' : ''}`}>

                                        <div className="text-xs uppercase">{day.toLocaleDateString('en-US', { weekday: 'short' })}</div>

                                        {dayTasks.map(task => (

        function AddTeamMemberForm({ onSubmit }) {

            return (
                <div>
